name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # bun's version mirrors the raspberry pi that runs this in production
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - name: biome
        run: bun run check-ci

      - run: bun run typecheck

      - run: bun run build
