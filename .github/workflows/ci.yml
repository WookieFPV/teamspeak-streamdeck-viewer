name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      # node 22 mirrors the raspberry pi that runs this in production (the newest
      # node version with official armv7l builds; node 24 dropped 32-bit ARM)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: biome
        run: pnpm check-ci

      - run: pnpm typecheck

      - run: pnpm build
